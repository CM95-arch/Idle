<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#0d1008" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Snake Pit · prototype</title>
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml" />
  <link rel="preload" href="assets/fonts/PixelifySans.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/main.css" />
  <style>
    html, body { height: 100%; overscroll-behavior: none; }
    body { background: #0d1008; touch-action: none; -webkit-user-select: none; user-select: none; }
    #ar { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr auto; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); color: #fff; font-family: Nunito, system-ui, sans-serif; }
    #ar canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    .ahud { display: flex; align-items: center; gap: 8px; padding: 8px 10px; background: #161b10; }
    .ahud .grow { flex: 1; min-width: 0; }
    .abtn2 { border-radius: 10px; padding: 8px 12px; font-weight: 900; font-size: 14px; border: 2px solid #000; box-shadow: 0 3px 0 #000; }
    .retreat { background: #c0392b; color: #fff; }
    .rooms2 { display: flex; gap: 5px; } .rooms2 i { width: 22px; height: 6px; border-radius: 3px; background: #3a4a2a; } .rooms2 i.done { background: #7fc04a; } .rooms2 i.now { background: #ffd34d; }
    .bbar { height: 9px; border-radius: 5px; background: #333; overflow: hidden; border: 1px solid #000; margin-top: 4px; } .bbar i { display: block; height: 100%; background: #e0483e; }
    .vbar { height: 12px; border-radius: 6px; background: #2a2f22; overflow: hidden; border: 1px solid #000; position: relative; }
    .vbar i { display: block; height: 100%; } .vbar b { position: absolute; inset: 0; font-size: 10px; line-height: 12px; text-align: center; font-weight: 900; text-shadow: 0 1px 0 #000; }
    .cast { width: 64px; height: 64px; border-radius: 50%; background: #3d7fe0; color: #fff; font-size: 11px; font-weight: 900; border: 3px solid #000; box-shadow: 0 3px 0 #000; line-height: 1.1; }
    .cast:disabled { background: #444; color: #999; }
    .aover { position: fixed; inset: 0; background: rgba(8,10,6,.86); display: grid; place-items: center; padding: 20px; z-index: 5; }
    .acard { background: #f6f3ea; color: #20262e; border-radius: 16px; padding: 18px; width: min(360px, 100%); display: grid; gap: 10px; border: 3px solid #000; }
    .acard h2 { margin: 0; text-align: center; }
    .opt { display: flex; gap: 6px; flex-wrap: wrap; } .opt button { flex: 1; padding: 9px 6px; border-radius: 10px; border: 2px solid #20262e; background: #fff; font-weight: 900; font-size: 13px; }
    .opt button.on { background: #20262e; color: #fff; }
    .note { font-size: 12.5px; font-weight: 700; color: #4b5562; }
    .lootrow { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 14px; }
    .bagdot { width: 14px; height: 14px; border-radius: 4px; border: 2px solid #000; }
  </style>
</head>
<body>
  <div id="ar"></div>
  <script type="module" src="js/arena/main.js"></script>
</body>
</html>
